<!-- Save this file as banner.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#12b886"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="f1" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#g1)"/>
  
  <!-- Decorative grid / nodes -->
  <g opacity="0.18" transform="translate(40,20)">
    <g stroke="#ffffff" stroke-opacity="0.06" fill="none">
      <path d="M0 40 L1200 40 M0 120 L1200 120 M0 200 L1200 200" />
      <circle cx="1100" cy="60" r="48" stroke="#ffffff" stroke-opacity="0.04" />
      <circle cx="980" cy="190" r="32" stroke="#ffffff" stroke-opacity="0.04" />
    </g>
  </g>

  <!-- Main card -->
  <g transform="translate(60,40)">
    <rect width="1080" height="200" rx="14" fill="#071126" opacity="0.55" filter="url(#f1)"/>
    <g transform="translate(28,22)">
      <!-- Left portrait / badge -->
      <rect x="0" y="0" width="160" height="160" rx="12" fill="url(#g2)"/>
      <text x="200" y="36" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" fill="#cfeefd" font-weight="700">Teja Kavikondala</text>
      <text x="200" y="66" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" fill="#9fcbdc">Senior Software Engineer</text>
      <text x="200" y="100" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" fill="#b9dbe6">
        Cloud-native systems · Microservices · Distributed Systems
      </text>

      <!-- Key metrics badges -->
      <g transform="translate(200,120)" font-family="Inter, Arial, Helvetica, sans-serif">
        <rect x="0" y="-18" rx="8" width="220" height="36" fill="#071126" stroke="#0ea5a2" stroke-opacity="0.12"/>
        <text x="14" y="6" font-size="12" fill="#c8f9f5">API throughput ↑ ~35% • Docker build ↓ ~40% • Infra provisioning ↓ ~60%</text>
      </g>

      <!-- Accent lines -->
      <line x1="180" y1="8" x2="820" y2="8" stroke="#0ea5a2" stroke-opacity="0.06" />
      <line x1="180" y1="30" x2="820" y2="30" stroke="#06b6d4" stroke-opacity="0.02" />
    </g>
  </g>

  <!-- Signature and dots -->
  <g transform="translate(920,220)" opacity="0.6">
    <text x="0" y="0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" fill="#9fcbdc">Senior Software Engineer • Cloud & Systems</text>
  </g>
</svg>
